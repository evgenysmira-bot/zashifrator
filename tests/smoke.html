  .row { font-family: Consolas, monospace; font-size: 12px; }
  .badge { display: inline-block; min-width: 42px; text-align: center; padding: 1px 6px; border-radius: 10px; font-size: 10px; margin-right: 6px; }

const Z = window.Zashifrator;
const out = document.getElementById('output');

let pass = 0, fail = 0;
function section(title) {
  const h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
}
function check(name, cond, detail) {
  const ok = !!cond;
  if (ok) pass++; else fail++;
  const row = document.createElement('div');
  row.className = 'row';
  row.innerHTML = `<span class="badge ${ok ? 'pass' : 'fail'}">${ok ? 'ok' : 'FAIL'}</span>${escapeHtml(name)}${detail ? ' — <em>' + escapeHtml(detail) + '</em>' : ''}`;
  out.appendChild(row);
}
function log(msg) {
  const p = document.createElement('div'); p.className = 'row'; p.textContent = msg; out.appendChild(p);
}
function pre(text) {
  const p = document.createElement('pre'); p.textContent = text; out.appendChild(p);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}

// --- Каноническая группировка компаний ---
section('Разные формы одной компании → одна маска');
{
  const text = 'Публичное акционерное общество «Сбербанк России», (ПАО Сбербанк) заключает...';
  const finds = Z.findAll(text);
  const { inverse } = Z.buildReplacements(finds, {});
  const pairs = Object.entries(inverse);
  const sbMasks = pairs.filter(([o]) => /Сбербанк/i.test(o)).map(([,m]) => m);
  check('Обе формы Сбера получили ОДНУ маску',
    sbMasks.length === 2 && sbMasks[0] === sbMasks[1],
    'масок: ' + JSON.stringify(sbMasks));

  // Round-trip: маскируем → строим словарь как делает taskpane → демаскируем
  let masked = text;
  const dict = {};
  const orderedOrigs = {};
  for (const f of finds) {
    const m = inverse[f.value];
    if (!dict[m]) dict[m] = { type: f.type, originals: [] };
    if (!dict[m].originals.includes(f.value)) dict[m].originals.push(f.value);
    if (f.type === 'company') {
      const canon = Z.canonicalCompanyKey(f.meta);
      if (canon) dict[m].canon = canon;
    }
  }
  const pairsSorted = [...new Set(pairs.map(p => p[0]))].sort((a,b) => b.length - a.length);
  for (const orig of pairsSorted) masked = masked.split(orig).join(inverse[orig]);

  // Демаскировка по позициям
  const unmaskEntries = Object.entries(dict).sort((a,b) => b[0].length - a[0].length);
  let restored = masked;
  for (const [mask, info] of unmaskEntries) {
    const originals = info.originals;
    // разбиваем restored по маске, вставляем originals по очереди
    const parts = restored.split(mask);
    let rebuilt = parts[0];
    for (let i = 1; i < parts.length; i++) {
      const orig = originals[Math.min(i - 1, originals.length - 1)];
      rebuilt += orig + parts[i];
    }
    restored = rebuilt;
  }
  check('Round-trip сохраняет оригинальные варианты', restored === text,
    restored === text ? '' : 'разошлись: "' + restored + '"');
}

// ===== Round-trip =====
section('Имитация цикла: маскировка → демаскировка');

function maskText(text) {
  const fs = Z.findAll(text);
  const { inverse } = Z.buildReplacements(fs, {});
  const dict = {};
  // Новая схема: originals[] в порядке появления
  for (const f of fs) {
    const m = inverse[f.value];
    if (!m) continue;
    if (!dict[m]) dict[m] = { type: f.type, originals: [] };
    if (!dict[m].originals.includes(f.value)) dict[m].originals.push(f.value);
  }
  const uniqOrigs = [...new Set(fs.map(f => f.value))].sort((a, b) => b.length - a.length);
  let masked = text;
  for (const orig of uniqOrigs) masked = masked.split(orig).join(inverse[orig]);
  return { masked, dict };
}
function unmaskText(text, dict) {
  const entries = Object.entries(dict).sort((a, b) => b[0].length - a[0].length);
  let r = text;
  for (const [mask, info] of entries) {
    const originals = info.originals || (info.original ? [info.original] : []);
    if (originals.length === 0) continue;
    const parts = r.split(mask);
    let rebuilt = parts[0];
    for (let i = 1; i < parts.length; i++) {
      const orig = originals[Math.min(i - 1, originals.length - 1)];
      rebuilt += orig + parts[i];
    }
    r = rebuilt;
  }
  return r;
}

const { masked, dict } = maskText(sampleText);
log('Размер словаря: ' + Object.keys(dict).length);

const det = document.createElement('details');
det.innerHTML = '<summary>Посмотреть замаскированный текст</summary>';
const mp = document.createElement('pre'); mp.textContent = masked; det.appendChild(mp);
out.appendChild(det);

const det2 = document.createElement('details');
det2.innerHTML = '<summary>Посмотреть словарь замен</summary>';
const dp = document.createElement('pre');
dp.textContent = Object.entries(dict).map(([m, i]) => `${i.original}  →  ${m}`).join('\n');
det2.appendChild(dp);
out.appendChild(det2);

const restored = unmaskText(masked, dict);
check('Round-trip идентичен оригиналу', restored === sampleText,
  restored === sampleText ? '' : 'тексты разошлись — длины: ' + sampleText.length + ' vs ' + restored.length);

const leaks = [
  '7707083893','1027700132195','7736050003','1027739552642',
  '500100732259','304500116000157','7728168971',
  'Ромашка','Сбербанк','Альфа-Банк'
].filter(x => masked.includes(x));
check('В замаскированном тексте нет оригинальных значений', leaks.length === 0,
  leaks.length ? 'осталось: ' + leaks.join(', ') : '');

// Все маски — в формате [ТИП_N]
const maskFormatRe = /^\[[А-ЯЁ_]+_\d+\]$/;
const badFmt = Object.keys(dict).filter(m => !maskFormatRe.test(m));
check('Все маски имеют формат [ТИП_N]', badFmt.length === 0,
  badFmt.length ? 'не в формате: ' + badFmt.slice(0, 3).join(', ') : '');

// В словаре никакая маска не равна оригиналу (иначе round-trip не сработает)
const maskEqOrig = Object.entries(dict).filter(([m, i]) => m === i.original);
check('Маска != оригинал', maskEqOrig.length === 0,
  maskEqOrig.length ? 'совпали: ' + maskEqOrig.length : '');

// ===== Итог =====
const s = document.getElementById('summary');
s.className = 'result ' + (fail === 0 ? 'pass' : 'fail');
s.textContent = fail === 0
  ? `✓ Все ${pass} проверок пройдены`
  : `✗ ${fail} из ${pass + fail} проверок провалены`;

// Дублируем в title для удобства автоматической проверки
document.title = (fail === 0 ? 'PASS' : 'FAIL') + ` ${pass}/${pass+fail} — Зашифратор smoke`;
window.__testSummary = { pass, fail };
</script>
