<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Data Hedgehog</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    :root {
      --accent: #2f3e5c;
      --accent-dark: #1f2a3f;
      --bg: #faf9f8;
      --border: #e1dfdd;
      --muted: #605e5c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Segoe UI Web (West European)", Tahoma, sans-serif;
      padding: 20px 16px;
      font-size: 14px;
      color: #252423;
      background: white;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 4px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }
    .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 8px; }

    button {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: white;
      color: #252423;
      transition: background 0.15s, border-color 0.15s;
    }
    button:hover:not(:disabled) { background: var(--bg); border-color: #c7c5c2; }
    button:disabled { opacity: 0.5; cursor: default; }
    button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    button.primary:hover:not(:disabled) {
      background: var(--accent-dark);
      border-color: var(--accent-dark);
    }

    .status {
      padding: 10px 12px;
      background: var(--bg);
      border-left: 3px solid var(--accent);
      font-size: 12px;
      color: var(--muted);
      min-height: 38px;
      border-radius: 2px;
      word-break: break-word;
    }
    .status.error { border-left-color: #a4262c; color: #a4262c; }
    .status.ok    { color: #252423; }
  </style>
</head>
<body>
  <h1>Data Hedgehog</h1>
  <div class="subtitle">Маскирует ИНН, ОГРН, КПП, БИК, счета, ФИО, адреса, email и телефоны.</div>

  <button id="btnMask"   class="primary">Замаскировать</button>
  <button id="btnUnmask">Демаскировать</button>

  <div class="status" id="status">Готов к работе.</div>

  <script src="core.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
