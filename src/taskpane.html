<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Data Hedgehog</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    :root {
      --primary:       #7c8aa3;   /* мягкий серо-синий */
      --primary-hover: #6a7992;
      --secondary:     #f3f4f6;   /* едва серая заливка */
      --secondary-hover:#e9ebef;
      --text:          #252423;
      --muted:         #6e7079;
      --border:        #e5e7eb;
      --ok:            #107c10;
      --err:           #a4262c;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Segoe UI Web (West European)", Tahoma, sans-serif;
      padding: 18px 16px;
      font-size: 14px;
      color: var(--text);
      background: white;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .intro {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    button {
      width: 100%;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border-radius: 6px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    button:disabled { opacity: 0.5; cursor: default; }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    button.primary:hover:not(:disabled) {
      background: var(--primary-hover);
      border-color: var(--primary-hover);
    }

    button.secondary {
      background: var(--secondary);
      color: var(--text);
      border-color: var(--border);
    }
    button.secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
      border-color: #d8dadf;
    }

    .status {
      padding: 9px 12px;
      background: var(--secondary);
      border-left: 3px solid var(--primary);
      font-size: 12px;
      color: var(--muted);
      border-radius: 3px;
      word-break: break-word;
    }
    .status.hidden { display: none; }
    .status.error  { border-left-color: var(--err); color: var(--err); background: #fdf2f2; }
    .status.ok     { border-left-color: var(--ok);  color: var(--text); }
  </style>
</head>
<body>
  <div class="intro">До загрузки документа в нейросеть замаскируйте чувствительные данные.</div>

  <button id="btnMask"   class="primary">Замаскировать</button>
  <button id="btnUnmask" class="secondary">Демаскировать</button>

  <div class="status hidden" id="status"></div>

  <script src="core.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
