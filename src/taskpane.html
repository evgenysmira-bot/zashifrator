<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Data Hedgehog</title>
  <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
  <style>
    :root {
      --primary:        #5a6b88;     /* приглушённый слейт-синий */
      --primary-hover:  #49587160;   /* чуть темнее для hover */
      --secondary:      #f3f4f6;     /* светло-серый */
      --secondary-hover:#e7e9ee;
      --text:           #1f2937;
      --muted:          #6b7280;
      --border:         #e5e7eb;
      --ok:             #22c55e;
      --err:            #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", "Segoe UI Web (West European)", Tahoma, sans-serif;
      padding: 20px 18px;
      font-size: 14px;
      color: var(--text);
      background: white;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.2px;
    }
    .intro {
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    button:disabled { opacity: 0.55; cursor: default; }
    button .icon {
      width: 20px; height: 20px;
      flex-shrink: 0;
      display: block;
    }
    /* Когда кнопка disabled — центрируем текст, иконка остаётся слева */
    button .label { flex: 0 1 auto; }

    button.primary {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    button.primary:hover:not(:disabled) {
      background: #495672;
      border-color: #495672;
    }

    button.secondary {
      background: var(--secondary);
      color: var(--text);
      border-color: var(--border);
    }
    button.secondary:hover:not(:disabled) {
      background: var(--secondary-hover);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #f9fafb;
      border-left: 4px solid var(--primary);
      font-size: 13px;
      color: var(--text);
      border-radius: 6px;
      word-break: break-word;
    }
    .status.hidden { display: none; }
    .status.ok     { border-left-color: var(--ok); }
    .status.error  { border-left-color: var(--err); color: var(--err); background: #fef2f2; }
    .status .badge {
      width: 22px; height: 22px; flex-shrink: 0;
      color: var(--muted);
    }
    .status.ok .badge    { color: var(--ok); }
    .status.error .badge { color: var(--err); }

    .footer {
      margin-top: auto;
      padding-top: 12px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.2px;
    }
  </style>
</head>
<body>
  <h1>Data Hedgehog</h1>

  <div class="intro">
    Перед загрузкой документа в нейросеть замените чувствительные данные
    на обезличенные плейсхолдеры. Для этого нажмите кнопку «Замаскировать».
  </div>

  <button id="btnMask" class="primary" type="button">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
    </svg>
    <span class="label">Замаскировать</span>
  </button>

  <button id="btnUnmask" class="secondary" type="button">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="11" width="16" height="10" rx="2"/>
      <path d="M8 11V7a4 4 0 0 1 7.5-1.8"/>
    </svg>
    <span class="label">Демаскировать</span>
  </button>

  <div class="status hidden" id="status">
    <svg class="badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" id="statusBadge">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9 12l2 2 4-4"/>
    </svg>
    <span id="statusText"></span>
  </div>

  <div class="footer">v1.3.5.0</div>

  <script src="core.js"></script>
  <script src="taskpane.js"></script>
</body>
</html>
